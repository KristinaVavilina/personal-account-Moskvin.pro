# Публичный VPS: только порт 80 наружу, БД/API/Seq — внутри Docker-сети (любой IP/домен).
# Запуск: docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# Бэкенд не меняется — переопределяются только пробросы портов compose.

services:
  db:
    ports: !reset []

  backend:
    ports: !reset []

  seq:
    ports: !reset []

  frontend:
    ports: !override
      - "0.0.0.0:80:80"
